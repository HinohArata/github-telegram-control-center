services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: control_center
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d control_center"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bot:bot@postgres:5432/control_center?sslmode=disable
      PORT: "8080"
      TELEGRAM_UPDATE_MODE: webhook
      # WEBHOOK_BASE_URL must be publicly reachable over HTTPS, e.g.
      # WEBHOOK_BASE_URL: https://bot.example.com
    ports:
      - "8080:8080"

volumes:
  pgdata:
